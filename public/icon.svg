<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- App Icon Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#blueGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="6" />

  <!-- Motorcycle & Wrench Emblem -->
  <g transform="translate(64, 64)" filter="url(#shadow)">
    <!-- Wheels -->
    <circle cx="80" cy="270" r="54" fill="none" stroke="#ffffff" stroke-width="22" />
    <circle cx="80" cy="270" r="22" fill="#ffffff" />
    
    <circle cx="304" cy="270" r="54" fill="none" stroke="#ffffff" stroke-width="22" />
    <circle cx="304" cy="270" r="22" fill="#ffffff" />

    <!-- Bike Frame Lines -->
    <path d="M80 270 L140 180 L230 180 L290 270" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M140 180 L180 270 L304 270" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M230 180 L200 110 L250 110" fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Fuel Tank shape -->
    <path d="M145 175 C160 145, 215 145, 225 175 Z" fill="#93c5fd" />
    
    <!-- Speed Accent / Spark -->
    <circle cx="192" cy="70" r="16" fill="#fbbf24" />
  </g>
</svg>
